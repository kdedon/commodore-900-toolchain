# release -- build every gate from clean on a v* tag, then publish the
# deliverables as versioned assets (AUTOMATION.md 13).
#
# The assets are the two host archives, the Z8001 one, and -- cut from the same
# staged tree, so they are one build of the same files -- the libc and include
# packages, which let a consumer take and name the libraries or the headers
# without a host compiler.  host/release-pack.sh emits all of them and the
# publish job uploads dist/*, so a new package needs no step of its own here.
# Only the Linux job cuts them: the three assets besides the host archive are
# host-independent, so the Windows job packs its zip alone (release-pack.sh
# -hostonly) rather than building a second set nobody publishes.
#
# THE TAG IS THE RELEASER'S TO CHOOSE.  This workflow reads the version off it
# and does not judge it: a patch may change an opcode, and a fix to the divide
# lowering is an ordinary patch.  The release notes say what changed; a CI job
# refusing a tag because the bytes moved fought the work instead of checking it.
#
# The release is built against a SPECIFIC COHERENT commit -- deliverable 3 needs
# libc-z8001.a, whose source belongs to the operating system -- and that commit
# is part of the release's identity.  host/release-pack.sh records it in the
# stamp inside the archive, beside the binaries it describes, and refuses to
# pack without it: an archive nobody can trace back to an OS commit cannot be
# rebuilt, and a release that cannot be rebuilt is a binary drop.  The packer
# does it rather than this workflow so that a release cut BY HAND -- which is
# the only way to cut one while the OS repository is unpublished -- carries the
# same identity as one cut here.
#
# WHERE build.yml SKIPS, THIS REFUSES.  A push may legitimately be tested
# without an OS tree; a release may not be BUILT without one, because half the
# archive comes from it.  So the OS edge is checked first and by name, and a
# tag with nothing to build against fails loudly instead of publishing a
# toolchain with no C library in it.
name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: src, fetch-depth: 0 }
      # Checked by CONTENT, through this repository's own resolver: what matters
      # is that the directories are there, not that a fetch step reported
      # success.
      - name: The OS source this release is built from
        working-directory: src
        run: |
          # Announced here, refused below.  A release may not be built without
          # the OS source, so this failing is fatal -- but the refusal names
          # the missing edge, not the reason it is missing, and both matter.
          make deps DEP=coherent || \
            echo "::warning title=The OS snapshot was not placed::make deps DEP=coherent failed; the refusal below is its consequence."
          p=$(sh host/deps.sh coherent)
          [ -n "$p" ] || {
            echo "no COHERENT OS source: the pinned snapshot could not be placed."
            echo "It must hold include/, libc/ and csu/: the release archive carries"
            echo "usr/include and native/libc-z8001.a, libm-z8001.a and"
            echo "libmisc-z8001.a, all built from that source, and the archive's"
            echo ".provenance names the commit it came from."
            echo "DEPS names the tag; publish that release, or cut this one by hand"
            echo "from a checkout that has the OS tree."
            exit 1
          }
          echo "COHERENT OS source: $p"
          cat "$p/.provenance" 2>/dev/null || :
          echo "COHERENT OS source: $p ($(git -C "$GITHUB_WORKSPACE/coherent" rev-parse HEAD))"

      # THE TAG IS THE VERSION.  It is stated once, by the person who pushes it,
      # and everything downstream derives from $V -- there is no VERSION file to
      # disagree with.  A dispatch run has no tag and is not a release: it packs
      # under 0.0.0-<sha> so an archive from one cannot be mistaken for an
      # archive from the other.
      - name: The version is the tag
        run: |
          case "$GITHUB_REF" in
          refs/tags/v*) echo "V=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV" ;;
          *)            echo "V=0.0.0-$(echo "$GITHUB_SHA" | cut -c1-8)" >> "$GITHUB_ENV" ;;
          esac

      - name: Place the pinned emulator
        working-directory: src
        run: make deps DEP=emu

      - name: Gates S0-S3
        working-directory: src
        env:
          C900_EMU: ${{ github.workspace }}/src/external/commodore-900-emulator/bin/c900
        run: |
          make all
          make check
          make libc libm libmisc selfhost native
          make check-selfhost

      # The version, the emulator pin and the COHERENT commit are the packer's
      # to record -- see host/release-pack.sh -- so that an archive built here
      # and one built by hand carry the same stamp.
      - name: Package
        working-directory: src
        run: sh host/release-pack.sh "$V"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: src/host/build/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: linux-objects
          path: src/host/build/selfhost/root/work/h2/*.o

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with: { path: src }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc make perl python zip unzip tar
            diffutils coreutils findutils gawk grep sed patch curl git

      - name: The version is the tag
        run: |
          case "$GITHUB_REF" in
          refs/tags/v*) echo "V=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV" ;;
          *)            echo "V=0.0.0-$(echo "$GITHUB_SHA" | cut -c1-8)" >> "$GITHUB_ENV" ;;
          esac

      # Refused here as well as in the Linux job: this one packs the zip, and a
      # zip packed without usr/include is an archive a consumer cannot compile
      # against.
      - name: The OS source this release is built from
        working-directory: src
        run: |
          # Announced here, refused below.  A release may not be built without
          # the OS source, so this failing is fatal -- but the refusal names
          # the missing edge, not the reason it is missing, and both matter.
          make deps DEP=coherent || \
            echo "::warning title=The OS snapshot was not placed::make deps DEP=coherent failed; the refusal below is its consequence."
          p=$(sh host/deps.sh coherent)
          [ -n "$p" ] || {
            echo "no COHERENT OS source beside this checkout: it must hold"
            echo "include/, libc/ and csu/.  The Windows archive carries"
            echo "usr/include from it, and its .provenance names the commit."
            echo "That repository is unpublished (DEPS: coherent local)."
            exit 1
          }
          echo "COHERENT OS source: $p"

      - name: Place the pinned emulator
        working-directory: src
        run: make deps DEP=emu
      - name: Gates S0-S1, and the corpus for the cross-host comparison
        working-directory: src
        run: |
          export C900_EMU=$(pwd)/external/commodore-900-emulator
          make all
          make check
          sh host/selfhost-root.sh
          sh host/build-selfhost2.sh -hostonly
      # Deliverable 3 is host-independent and the Linux job already built it, so
      # the Windows archive takes it from there rather than cross-building it
      # twice: it must be the SAME native compiler in both archives, and copying
      # is the only way to say that rather than hope it.
      - uses: actions/download-artifact@v4
        with: { name: linux-dist, path: dist-linux }

      # The Windows archive is packed by release-pack.sh, the same script that
      # packs the Linux one.  It was hand-rolled here once, and the two layouts
      # drifted: the zip carried no host/ view at all, so a consumer that
      # unpacked it and set $C900_TOOLCHAIN found nothing at the one path every
      # consuming makefile spells (host/build/z8001/cc0-z8001).  One packer is
      # the fix; the equivalence job now compares the two archives' contents so
      # that a second drift is a red build rather than a broken release.
      #
      # What the script needs beyond `make all' is deliverable 3, which is what
      # the Linux -z8001 archive holds: it is unpacked into the build directory
      # under the names the packer reads, so the two archives ship the same
      # native compiler and the same Z8001 libraries by construction.
      - name: Seed deliverable 3 from the Linux archive
        working-directory: src
        run: |
          set -e
          tar xzf ../dist-linux/c900-toolchain-v$V-z8001.tar.gz -C ..
          z=../c900-toolchain-v$V-z8001/native
          B=host/build
          mkdir -p $B/native $B/libc-z8001/kobj $B/libm-z8001 $B/libmisc-z8001
          cp $z/cc $z/as $z/ld $B/native/
          cp $z/crt0.o $z/libc-z8001.a $B/libc-z8001/
          # kobj/: the five objects the KERNEL links by name.  They are part of
          # deliverable 3 and travel in the archive beside the library.
          cp $z/kobj/*.o $B/libc-z8001/kobj/
          cp $z/libm-z8001.a $B/libm-z8001/
          cp $z/libmisc-z8001.a $B/libmisc-z8001/
      # -hostonly: the zip and nothing else.  The other three assets are
      # host-independent, the Linux job's copies are the published ones, and
      # packing a second set here only adds MSYS-specific ways for a release to
      # fail on bytes nobody would have downloaded.
      - name: Package
        working-directory: src
        run: |
          set -e
          sh host/release-pack.sh -hostonly "$V"
      # Only the zip, and now it is the only thing there is: -hostonly above
      # stops the packer cutting the host-independent assets a second time.  The
      # released ones are the Linux job's, and two artifacts of the same name
      # would collide in the publish job's download directory anyway.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: src/host/build/dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-objects
          path: src/host/build/selfhost/root/work/h2/*.o

  equivalence:
    needs: [ linux, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: src }
      - uses: actions/download-artifact@v4
        with: { name: linux-objects, path: obj/linux }
      - uses: actions/download-artifact@v4
        with: { name: windows-objects, path: obj/windows }
      - name: The two hosts are one compiler
        run: sh src/host/cmp-objdirs.sh obj/linux obj/windows linux windows

      # The objects being identical says nothing about whether either archive
      # can be USED.  What a consumer resolves is a layout, so the layout is
      # compared too -- see host/cmp-archives.sh.
      - uses: actions/download-artifact@v4
        with: { name: linux-dist, path: dist/linux }
      - uses: actions/download-artifact@v4
        with: { name: windows-dist, path: dist/windows }
      - name: The two archives are one archive
        run: |
          v=${GITHUB_REF_NAME#v}
          sh src/host/cmp-archives.sh \
             dist/linux/c900-toolchain-v$v-linux-x86_64.tar.gz \
             dist/windows/c900-toolchain-v$v-windows-x86_64.zip \
             linux windows

  publish:
    needs: [ linux, windows, equivalence ]
    # BOTH hosts must have passed.  A release is the two archives and the
    # equivalence between them; publishing the Linux one alone would hand out a
    # tag that promises three deliverables and carries two.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { path: src, fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: linux-dist, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: windows-dist, path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
