# release -- on a v* tag, run every gate from clean and publish the archives
# host/release-pack.sh cuts: the Linux and Windows host archives, the z8001
# archive, the libc and include packages, and the tools.  The Linux job cuts
# the host-independent ones; Windows packs only its zip (-hostonly).
# The tag is the version; everything ships from this checkout.
name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: src, fetch-depth: 0 }
      - name: The version is the tag
        run: |
          case "$GITHUB_REF" in
          refs/tags/v*) echo "V=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV" ;;
          *)            echo "V=0.0.0-$(echo "$GITHUB_SHA" | cut -c1-8)" >> "$GITHUB_ENV" ;;
          esac

      - name: Place the pinned emulator
        working-directory: src
        run: make deps DEP=emu

      - name: Gates S0-S3
        working-directory: src
        env:
          C900_EMU: ${{ github.workspace }}/src/external/commodore-900-emulator/bin/c900
        run: |
          make all
          make check
          make libc libm libmisc selfhost native
          make tools tools-z8001
          make check-selfhost
          sh tests/nativetools.sh

      - name: Package
        working-directory: src
        run: sh host/release-pack.sh "$V"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: src/host/build/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: linux-objects
          path: src/host/build/selfhost/root/work/h2/*.o

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with: { path: src }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc make perl python zip unzip tar
            diffutils coreutils findutils gawk grep sed patch curl git

      - name: The version is the tag
        run: |
          case "$GITHUB_REF" in
          refs/tags/v*) echo "V=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV" ;;
          *)            echo "V=0.0.0-$(echo "$GITHUB_SHA" | cut -c1-8)" >> "$GITHUB_ENV" ;;
          esac
      - name: Place the pinned emulator
        working-directory: src
        run: make deps DEP=emu
      - name: Gates S0-S1, and the corpus for the cross-host comparison
        working-directory: src
        run: |
          export C900_EMU=$(pwd)/external/commodore-900-emulator
          make all
          make check
          make tools
          sh host/selfhost-root.sh
          sh host/build-selfhost2.sh -hostonly
      # The host archive carries the Z8001 libraries; take the Linux job's.
      - uses: actions/download-artifact@v4
        with: { name: linux-dist, path: dist-linux }

      - name: Seed the Z8001 libraries from the Linux archive
        working-directory: src
        run: |
          set -e
          tar xzf ../dist-linux/c900-libc-v$V-z8001.tar.gz -C ..
          z=../c900-libc-v$V-z8001/lib
          B=host/build
          mkdir -p $B/libc-z8001/kobj $B/libm-z8001 $B/libmisc-z8001
          cp $z/crt0.o $z/libc-z8001.a $B/libc-z8001/
          cp $z/kobj/*.o $B/libc-z8001/kobj/
          cp $z/libm-z8001.a $B/libm-z8001/
          cp $z/libmisc-z8001.a $B/libmisc-z8001/
      - name: Package
        working-directory: src
        run: |
          set -e
          sh host/release-pack.sh -hostonly "$V"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: src/host/build/dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-objects
          path: src/host/build/selfhost/root/work/h2/*.o

  equivalence:
    needs: [ linux, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: src }
      - uses: actions/download-artifact@v4
        with: { name: linux-objects, path: obj/linux }
      - uses: actions/download-artifact@v4
        with: { name: windows-objects, path: obj/windows }
      - name: The two hosts are one compiler
        run: sh src/host/cmp-objdirs.sh obj/linux obj/windows linux windows

      # Both archives must have one layout (host/cmp-archives.sh).
      - uses: actions/download-artifact@v4
        with: { name: linux-dist, path: dist/linux }
      - uses: actions/download-artifact@v4
        with: { name: windows-dist, path: dist/windows }
      - name: The two archives are one archive
        run: |
          v=${GITHUB_REF_NAME#v}
          sh src/host/cmp-archives.sh \
             dist/linux/c900-toolchain-v$v-linux-x86_64.tar.gz \
             dist/windows/c900-toolchain-v$v-windows-x86_64.zip \
             linux windows

  publish:
    needs: [ linux, windows, equivalence ]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { path: src, fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: linux-dist, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: windows-dist, path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
