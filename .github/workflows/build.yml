# build -- the bootstrap stages on both hosts, on every push.
#
#   S0  make all                     the host toolchain builds
#   S1  make check                   regression suite, run under the emulator
#   S2  make libc selfhost native    the compiler compiles itself to Z8001
#   S3  make check-selfhost          the target-built passes reproduce the host
#                                    compiler's objects byte for byte
#   S3b tests/nativetools.sh         the native as and ld match the host ones
#   S4  equivalence                  Linux and Windows emit identical objects
#
# CI sets C900_EMU explicitly; the dependency search has its own test
# (resolver-isolation.yml).
name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      C900_EMU: ${{ github.workspace }}/src/external/commodore-900-emulator/bin/c900
    steps:
      - uses: actions/checkout@v4
        with: { path: src }
      - name: The emulator pin
        id: pin
        run: echo "tag=$(sh src/host/deps-fetch.sh -tag emu)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: src/external
          key: deps-${{ runner.os }}-${{ steps.pin.outputs.tag }}
      - name: Place the pinned emulator
        working-directory: src
        run: make deps DEP=emu

      - name: S0 - host build
        working-directory: src
        run: make all
      - name: S1 - host correctness
        working-directory: src
        run: make check
      - name: S2 - target cross-build
        working-directory: src
        run: make libc selfhost native
      - name: S3 - the self-host fixpoint
        working-directory: src
        run: make check-selfhost
      - name: S3b - the native assembler and linker
        working-directory: src
        run: sh tests/nativetools.sh

      - name: Fixpoint evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: s3-evidence
          path: |
            src/host/build/selfhost/root/work/h2/
            src/host/build/selfhost/root/work/t2/
            src/host/build/z8001/.provenance
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: linux-toolchain
          path: |
            src/host/build/z8001/
            src/host/build/as-z8001
            src/host/build/ld-z8001
            src/host/build/mkarz
      - uses: actions/upload-artifact@v4
        with:
          name: linux-native-z8001
          path: |
            src/host/build/native/
            src/host/build/libc-z8001/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-objects
          path: src/host/build/selfhost/root/work/h2/*.o

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with: { path: src }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc make perl python unzip tar
            diffutils coreutils findutils gawk grep sed patch curl git
      - name: The emulator pin
        id: pin
        run: echo "tag=$(sh src/host/deps-fetch.sh -tag emu)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: src/external
          key: deps-${{ runner.os }}-${{ steps.pin.outputs.tag }}
      - name: Place the pinned emulator
        working-directory: src
        run: make deps DEP=emu

      # Paths are computed inside msys2: ${{ github.workspace }} has backslashes.
      - name: S0 - host build
        working-directory: src
        run: make all
      - name: S1 - host correctness
        working-directory: src
        run: |
          export C900_EMU=$(pwd)/external/commodore-900-emulator
          make check
      # Only the host half of the fixpoint: the objects are what can differ.
      - name: S4 - compile the corpus for the cross-host comparison
        working-directory: src
        run: |
          sh host/selfhost-root.sh
          sh host/build-selfhost2.sh -hostonly
      - uses: actions/upload-artifact@v4
        with:
          name: windows-objects
          path: src/host/build/selfhost/root/work/h2/*.o
      - uses: actions/upload-artifact@v4
        with:
          name: windows-toolchain
          path: |
            src/host/build/z8001/
            src/host/build/as-z8001*
            src/host/build/ld-z8001*
            src/host/build/mkarz*

  equivalence:
    needs: [ linux, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: src }
      - uses: actions/download-artifact@v4
        with: { name: linux-objects, path: obj/linux }
      - uses: actions/download-artifact@v4
        with: { name: windows-objects, path: obj/windows }
      - name: S4 - the two hosts are one compiler
        run: sh src/host/cmp-objdirs.sh obj/linux obj/windows linux windows
      - name: Both sides, when they disagree
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: s4-evidence
          path: obj/
          retention-days: 90
